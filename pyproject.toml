[project]
name = "aikeiba"
version = "0.1.0"
description = "AI-driven prediction system for JRA graded races"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "lightgbm>=4.3",
    "scipy>=1.17.1",
    "pyarrow>=25.0.1",
]

[project.scripts]
aikeiba-backtest = "aikeiba.backtest:main"
aikeiba-simulate = "aikeiba.simulate:main"
aikeiba-train = "aikeiba.train:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aikeiba"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
