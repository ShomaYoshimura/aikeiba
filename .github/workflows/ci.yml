name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Synthetic backtest smoke test
        run: uv run aikeiba-backtest --test-years 2020

  architecture-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/architecture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/architecture/package-lock.json
      - run: npm ci
      - run: npm run build
